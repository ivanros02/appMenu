services:
  postgres:
    image: postgres:16-alpine
    container_name: menu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: menu_admin
      POSTGRES_PASSWORD: menu_pass
      POSTGRES_DB: menu_db
    ports:
      - "5432:5432"
    volumes:
      - menu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu_admin -d menu_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: menu-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # network_mode: host porque backend y frontend necesitan resolver "localhost"
  # de la misma forma que tu navegador (Server Components/Actions hacen fetch
  # server-side, y el browser hace fetch client-side). Solo funciona en Linux nativo.
  backend:
    build:
      context: ./menu-back
    container_name: menu-backend
    network_mode: "host"
    environment:
      DATABASE_URL: postgresql://menu_admin:menu_pass@localhost:5432/menu_db?schema=public
      JWT_SECRET: una_palabra_secreta_super_larga_y_dificil_que_nadie_sepa_12345
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./menu-back:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && pnpm start:dev"

  frontend:
    build:
      context: ./menu-front
    container_name: menu-frontend
    network_mode: "host"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./menu-front:/app
      - /app/node_modules
      - /app/.next
    command: pnpm exec next dev --port 3001

volumes:
  menu_postgres_data:
